<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonMandarin Maestro — Compendio Interactivo Chino Mandarín</title>
    <style>
        :root {
            --active-color: #ff2a5f;
            --bg-dark: #090b10;
            --card-bg: rgba(22, 26, 42, 0.72);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 12%, color-mix(in srgb, var(--active-color) 35%, transparent) 0%, transparent 60%),
                radial-gradient(circle at 85% 85%, rgba(0, 210, 255, 0.08) 0%, transparent 45%);
            transition: background 0.5s ease;
        }

        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* HEADER & TOP CONTROLS */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(9, 11, 16, 0.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 1.2rem;
        }

        .top-bar {
            max-width: 1350px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 12px var(--active-color));
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand span {
            font-size: 0.78rem;
            color: #9ca3af;
            display: block;
        }

        .controls-wrap {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 0.55rem 1rem 0.55rem 2.3rem;
            border-radius: 30px;
            font-size: 0.9rem;
            width: 240px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--active-color);
            box-shadow: 0 0 15px color-mix(in srgb, var(--active-color) 50%, transparent);
            width: 280px;
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .mode-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.07);
            padding: 0.25rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #d1d5db;
            padding: 0.45rem 1.1rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
        }

        .mode-btn.active {
            background: var(--active-color);
            color: #fff;
            box-shadow: 0 0 16px var(--active-color);
        }

        /* CATEGORY NAVBAR */
        .category-navbar {
            max-width: 1350px;
            margin: 0.75rem auto 0;
            display: flex;
            gap: 0.55rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
            scrollbar-width: thin;
            scrollbar-color: var(--active-color) rgba(255,255,255,0.05);
        }

        .category-navbar::-webkit-scrollbar {
            height: 6px;
        }
        .category-navbar::-webkit-scrollbar-thumb {
            background: var(--active-color);
            border-radius: 10px;
        }

        .cat-pill {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e5e7eb;
            padding: 0.45rem 0.95rem;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cat-pill:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        .cat-pill.active {
            background: color-mix(in srgb, var(--active-color) 28%, rgba(20,20,35,0.9));
            border-color: var(--active-color);
            color: #fff;
            box-shadow: 0 0 18px color-mix(in srgb, var(--active-color) 55%, transparent);
        }

        .cat-count {
            background: rgba(0, 0, 0, 0.45);
            padding: 0.1rem 0.45rem;
            border-radius: 20px;
            font-size: 0.72rem;
            color: #a5b4fc;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1350px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 4rem;
        }

        /* STAGE SHOWCASE */
        .stage {
            background: rgba(18, 22, 36, 0.78);
            backdrop-filter: blur(22px);
            border: 2px solid color-mix(in srgb, var(--active-color) 55%, rgba(255,255,255,0.12));
            border-radius: 28px;
            padding: 1.8rem;
            max-width: 820px;
            margin: 0 auto 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 45px -12px var(--active-color);
            position: relative;
        }

        .stage-badge {
            display: inline-block;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: rgba(255,255,255,0.1);
            padding: 0.25rem 0.9rem;
            border-radius: 20px;
            margin-bottom: 0.8rem;
            color: #cbd5e1;
        }

        .stage-main-flex {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            flex-wrap: wrap;
            margin: 0.4rem 0 1rem;
        }

        .stage-emoji {
            font-size: 5rem;
            filter: drop-shadow(0 0 25px var(--active-color));
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stage-emoji:hover {
            transform: scale(1.18) rotate(8deg);
        }

        .stage-hanzi {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px var(--active-color);
            cursor: pointer;
            line-height: 1.1;
            transition: transform 0.2s;
        }

        .stage-hanzi:hover {
            transform: scale(1.06);
        }

        .stage-pinyin {
            font-size: 1.65rem;
            font-weight: 800;
            color: #111;
            background: #fff;
            padding: 0.25rem 1.2rem;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 0.6rem;
            box-shadow: 0 0 20px var(--active-color);
        }

        .stage-es {
            font-size: 1.45rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.4rem;
        }

        .stage-note {
            font-size: 0.92rem;
            color: #fde047;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.55rem 1rem;
            border-radius: 12px;
            display: inline-block;
            margin-top: 0.4rem;
            border-left: 3px solid var(--active-color);
        }

        /* CHARACTER BREAKDOWN CHIPS */
        .char-breakdown {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .char-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.4rem 0.85rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .char-chip:hover {
            background: var(--active-color);
            color: #fff;
            transform: translateY(-3px);
        }

        .audio-actions {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 0.55rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--active-color);
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 0 18px var(--active-color);
        }

        /* SECTION BANNER */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.4rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* VOCABULARY GRID */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 1rem;
        }

        .vocab-card {
            background: var(--card-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.1rem 0.85rem;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .vocab-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--card-color);
            opacity: 0.85;
        }

        .vocab-card:hover {
            transform: translateY(-7px) scale(1.03);
            border-color: var(--card-color);
            box-shadow: 0 12px 28px -6px var(--card-color);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .vocab-card:hover .card-icon {
            transform: scale(1.18) rotate(-6deg);
        }

        .card-hanzi {
            font-size: 1.65rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        .card-pinyin {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--card-color);
            margin-bottom: 0.3rem;
        }

        .card-es {
            font-size: 0.82rem;
            color: #d1d5db;
            font-weight: 600;
            line-height: 1.25;
        }

        /* QUIZ MODE */
        #quiz-section {
            display: none;
            max-width: 720px;
            margin: 0 auto;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.07);
            padding: 0.9rem 1.4rem;
            border-radius: 18px;
            margin-bottom: 1.2rem;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.2rem;
        }

        .quiz-btn {
            background: rgba(30, 35, 58, 0.85);
            border: 2px solid rgba(255,255,255,0.18);
            border-radius: 18px;
            padding: 1.1rem;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s;
        }

        .quiz-btn:hover {
            border-color: var(--active-color);
            background: rgba(255,255,255,0.12);
            transform: scale(1.02);
        }

        @media (max-width: 640px) {
            .quiz-options {
                grid-template-columns: 1fr;
            }
            .stage-hanzi {
                font-size: 3.2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <header>
        <div class="top-bar">
            <div class="brand">
                <div class="brand-logo">🐉</div>
                <div>
                    <h1>NEON MANDARIN MAESTRO</h1>
                    <span id="total-counter">Cargando vocabulario...</span>
                </div>
            </div>

            <div class="controls-wrap">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Buscar español, pinyin o hànzì..." oninput="handleSearch(this.value)">
                </div>

                <div class="mode-switch">
                    <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">🧪 Laboratorio</button>
                    <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">🎮 Arcade Quiz</button>
                </div>
            </div>
        </div>

        <nav class="category-navbar" id="category-navbar"></nav>
    </header>

    <main class="container">
        <!-- MODO LABORATORIO -->
        <section id="explore-section">
            <div class="stage" id="main-stage">
                <div class="stage-badge" id="stage-cat">Categoría</div>
                <div class="stage-main-flex">
                    <div class="stage-emoji" id="stage-emoji" onclick="replayCurrent(event)">👋</div>
                    <div>
                        <div class="stage-hanzi" id="stage-hanzi" onclick="replayCurrent(event)">你好</div>
                    </div>
                </div>
                <div class="stage-pinyin" id="stage-pinyin">nǐ hǎo</div>
                <div class="stage-es" id="stage-es">Hola</div>
                <div id="stage-note-wrap">
                    <div class="stage-note" id="stage-note">💡 Haz clic en cualquier carácter individual abajo para escucharlo por separado.</div>
                </div>

                <div class="char-breakdown" id="char-breakdown"></div>

                <div class="audio-actions">
                    <button class="action-btn" onclick="speakWord(currentItem.hanzi, 0.9)">🔊 Pronunciación Normal</button>
                    <button class="action-btn" onclick="speakWord(currentItem.hanzi, 0.55)">🐢 Modo Tortuga (Lento)</button>
                </div>
            </div>

            <div class="section-header">
                <div class="section-title" id="grid-title">✨ Vocabulario</div>
            </div>

            <div class="vocab-grid" id="vocab-grid"></div>
        </section>

        <!-- MODO QUIZ ARCADE -->
        <section id="quiz-section">
            <div class="score-bar">
                <span>🏆 Puntos: <span id="quiz-score">0</span></span>
                <span>🔥 Racha: <span id="quiz-streak">0</span></span>
            </div>
            <div class="stage" id="quiz-stage">
                <div class="stage-badge" id="quiz-cat-badge">Desafío</div>
                <div class="stage-hanzi" id="quiz-hanzi" style="margin: 0.6rem 0;">你好</div>
                <div class="stage-pinyin" id="quiz-pinyin">nǐ hǎo</div>
                <div class="audio-actions">
                    <button class="action-btn" onclick="speakWord(quizTarget.hanzi, 0.85)">🔊 Escuchar Pista</button>
                </div>
                <div class="quiz-options" id="quiz-options"></div>
            </div>
        </section>
    </main>

    <script>
        // CONFIGURACIÓN DE CATEGORÍAS DEL NAVBAR
        const categories = [
            { id: 'all', name: 'Todas', icon: '🌟', color: '#ff2a5f' },
            { id: 'saludos', name: 'Saludos y Cortesía', icon: '👋', color: '#f43f5e' },
            { id: 'pronombres', name: 'Pronombres y Preguntas', icon: '🫵', color: '#ec4899' },
            { id: 'particulas', name: 'Adverbios y Partículas', icon: '🧩', color: '#d946ef' },
            { id: 'familia', name: 'Familia y Personas', icon: '👨‍👩‍👧‍👦', color: '#a855f7' },
            { id: 'cuerpo', name: 'Cuerpo Humano (身体)', icon: '👂', color: '#c084fc' },
            { id: 'profesiones', name: 'Profesiones y Lugares', icon: '🏥', color: '#8b5cf6' },
            { id: 'verbos', name: 'Verbos y Rutina', icon: '⚡', color: '#6366f1' },
            { id: 'tiempo', name: 'Estaciones y Calendario', icon: '🗓️', color: '#0ea5e9' },
            { id: 'numeros', name: 'Números y Matemáticas', icon: '🔢', color: '#06b6d4' },
            { id: 'paises', name: 'Países, Idiomas y Deporte', icon: '🌍', color: '#14b8a6' },
            { id: 'clasificadores', name: 'Clasificadores (量词)', icon: '📦', color: '#10b981' },
            { id: 'adjetivos', name: 'Adjetivos y Emociones', icon: '✨', color: '#84cc16' },
            { id: 'colores', name: 'Colores (色彩)', icon: '🎨', color: '#eab308' },
            { id: 'animales', name: 'Zodiaco y Animales', icon: '🐉', color: '#f59e0b' },
            { id: 'comidas', name: 'Platos y Comidas', icon: '🍜', color: '#f97316' },
            { id: 'bebidas', name: 'Bebidas (饮料)', icon: '🧋', color: '#ef4444' },
            { id: 'verduras', name: 'Verduras (蔬菜)', icon: '🥦', color: '#22c55e' },
            { id: 'frutas', name: 'Frutas (水果)', icon: '🍉', color: '#fb7185' },
            { id: 'objetos', name: 'Utensilios y Objetos', icon: '🥢', color: '#38bdf8' },
            { id: 'transporte', name: 'Transporte (交通)', icon: '🚆', color: '#60a5fa' }
        ];

        // BASE DE DATOS COMPLETA — CADA PALABRA SEPARADA INDIVIDUALMENTE CON SU ILUSTRACIÓN
        const rawVocab = [
            // 1A. SALUDOS Y CORTESÍA
            ['saludos', '你好', 'nǐ hǎo', 'Hola', '👋', 'Saludo estándar en cualquier momento del día.'],
            ['saludos', '你好吗？', 'nǐ hǎo ma?', '¿Cómo estás?', '😊', 'Añade la partícula 吗 (ma) para convertir el saludo en pregunta.'],
            ['saludos', '早上好', 'zǎoshang hǎo', 'Buenos días', '🌅', 'Saludo matutino formal.'],
            ['saludos', '下午好', 'xiàwǔ hǎo', 'Buenas tardes', '🌇', 'Se usa después del mediodía.'],

            ['saludos', '谢谢', 'xièxie', 'Gracias', '🙏', 'Expresión básica de agradecimiento.'],
            ['saludos', '不客气', 'búkèqi', 'De nada', '🤗', 'Literalmente: "No seas cortés / formal".'],
            ['saludos', '对不起', 'duìbuqǐ', 'Perdón / Disculpas', '🙇', 'Para pedir disculpas sinceramente.'],
            ['saludos', '请', 'qǐng', 'Por favor / Invitar', '🤲', 'Se coloca al inicio de la frase para cortesía.'],
            ['saludos', '请进', 'qǐng jìn', 'Pase, por favor', '🚪', 'Usado al invitar a alguien a entrar a un lugar.'],
            ['saludos', '请问', 'qǐngwèn', 'Disculpe, una pregunta...', '🙋', 'Literalmente: "Por favor, pregunto...".'],
            ['saludos', '贵', 'guì', 'Costoso / Noble', '💎', 'Se usa tanto para precios altos como en expresiones honoríficas.'],
            ['saludos', '您贵姓？', 'nín guìxìng?', '¿Su honorable apellido?', '🪪', 'Forma muy respetuosa de preguntar el apellido.'],
            ['saludos', '先生', 'xiānsheng', 'Señor / Don / Esposo', '🤵', 'Título de respeto equivalente a "Señor".'],
            ['saludos', '马上就来', 'mǎshàng jiù lái', '¡Ya mismo viene! / ¡Enseguida voy!', '🏃', 'Literalmente: "Sobre el caballo ya viene".'],
            ['saludos', '很高兴认识你', 'hěn gāoxìng rènshi nǐ', 'Mucho gusto / Un gusto conocerte', '🤝', '高兴 (alegría momentánea) + 认识 (conocer) + 你.'],
            ['saludos', '你认识我吗？', 'nǐ rènshi wǒ ma?', '¿Me conoces?', '🤔', 'Oración afirmativa + 吗 al final = pregunta Sí/No.'],
            ['saludos', '我认识你吗？', 'wǒ rènshi nǐ ma?', '¿Te conozco?', '🧐', 'Igual que la anterior, solo se invierte el orden de 我 y 你.'],

            // 1B. PRONOMBRES, DEMOSTRATIVOS E INTERROGATIVOS
            ['pronombres', '我', 'wǒ', 'Yo', '🙋‍♂️', 'Pronombre de primera persona singular.'],
            ['pronombres', '你', 'nǐ', 'Tú', '👉', 'Pronombre de segunda persona singular.'],
            ['pronombres', '他', 'tā', 'Él', '👨', 'Usa el radical de persona (亻) a la izquierda.'],
            ['pronombres', '她', 'tā', 'Ella', '👩', 'Suena igual que 他 (tā), pero lleva el radical de mujer (女).'],
            ['pronombres', '您', 'nín', 'Usted (formal singular)', '🙇‍♂️', 'Añade un corazón (心) debajo de 你 para mostrar respeto.'],
            ['pronombres', '我们', 'wǒmen', 'Nosotros / Nosotras', '👥', 'El sufijo 们 (men) pluraliza los pronombres personales.'],

        const vocabData = rawVocab.map(([cat, hanzi, pinyin, es, icon, note], idx) => {
            const catObj = categories.find(c => c.id === cat) || categories[0];
            return {
                id: idx,
                cat,
                catName: catObj.name,
                color: catObj.color,
                hanzi,
                pinyin,
                es,
                icon,
                note
            };
        });

        let activeCategory = 'all';
        let searchQuery = '';
        let currentItem = vocabData[0];

        let quizScore = 0;
        let quizStreak = 0;

        // --- WEB AUDIO API SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq = 480, type = 'sine', dur = 0.18) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.35, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        // --- MANDARIN SPEECH SYNTHESIS ---
        function speakWord(text, rate = 0.88) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\(.*?\)/g, '').trim();
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'zh-CN';
            utter.rate = rate;
            window.speechSynthesis.speak(utter);
        }

        // --- PARTICLE ENGINE ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color, symbol = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.symbol = symbol;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 2.2;
                this.size = Math.random() * 7 + 4;
                this.alpha = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.17;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.symbol) {
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillStyle = this.color;
                    ctx.fillText(this.symbol, this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function burstParticles(x, y, color, icon, hanzi) {
            for (let i = 0; i < 32; i++) {
                let sym = null;
                if (i < 3) sym = icon;
                else if (i < 6) sym = hanzi[0];
                particles.push(new Particle(x, y, color, sym));
            }
        }

        function animateLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateLoop);
        }
        animateLoop();

        // --- RENDERIZAR NAVBAR ---
        function renderNavbar() {
            const nav = document.getElementById('category-navbar');
            nav.innerHTML = '';
            categories.forEach(cat => {
                const count = cat.id === 'all'
                    ? vocabData.length
                    : vocabData.filter(v => v.cat === cat.id).length;

                const btn = document.createElement('button');
                btn.className = `cat-pill ${activeCategory === cat.id ? 'active' : ''}`;
                btn.innerHTML = `
                    <span>${cat.icon}</span>
                    <span>${cat.name}</span>
                    <span class="cat-count">${count}</span>
                `;
                btn.onclick = () => {
                    activeCategory = cat.id;
                    document.documentElement.style.setProperty('--active-color', cat.color);
                    renderNavbar();
                    renderGrid();
                    if (document.getElementById('quiz-section').style.display === 'block') {
                        nextQuizRound();
                    }
                };
                nav.appendChild(btn);
            });
            document.getElementById('total-counter').textContent = `${vocabData.length} palabras interactivas separadas una por una • ${categories.length - 1} secciones`;
        }

        // --- RENDERIZAR GRID ---
        function getFilteredVocab() {
            return vocabData.filter(item => {
                const matchCat = activeCategory === 'all' || item.cat === activeCategory;
                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q ||
                    item.es.toLowerCase().includes(q) ||
                    item.pinyin.toLowerCase().includes(q) ||
                    item.hanzi.includes(q);
                return matchCat && matchSearch;
            });
        }

        function renderGrid() {
            const grid = document.getElementById('vocab-grid');
            const list = getFilteredVocab();
            const catObj = categories.find(c => c.id === activeCategory);
            document.getElementById('grid-title').innerHTML = `${catObj.icon} ${catObj.name} <span style="font-size:0.9rem; opacity:0.65;">(${list.length} tarjetas)</span>`;

            grid.innerHTML = '';
            list.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.style.setProperty('--card-color', item.color);
                card.innerHTML = `
                    <div class="card-icon">${item.icon}</div>
                    <div class="card-hanzi">${item.hanzi}</div>
                    <div class="card-pinyin">${item.pinyin}</div>
                    <div class="card-es">${item.es}</div>
                `;
                card.onclick = (e) => selectVocabItem(item, e.clientX, e.clientY, idx);
                grid.appendChild(card);
            });
        }

        // --- SELECCIONAR TARJETA ---
        function selectVocabItem(item, x, y, idx = 0) {
            currentItem = item;
            document.documentElement.style.setProperty('--active-color', item.color);
            document.getElementById('stage-cat').textContent = `${item.catName}`;
            document.getElementById('stage-emoji').textContent = item.icon;
            document.getElementById('stage-hanzi').textContent = item.hanzi;
            document.getElementById('stage-pinyin').textContent = item.pinyin;
            document.getElementById('stage-es').textContent = item.es;
            document.getElementById('stage-note').textContent = `💡 ${item.note}`;

            // Desglose carácter por carácter
            const breakdown = document.getElementById('char-breakdown');
            breakdown.innerHTML = '';
            const chars = [...item.hanzi].filter(ch => /[\u4e00-\u9fa5]/.test(ch));
            chars.forEach(ch => {
                const chip = document.createElement('span');
                chip.className = 'char-chip';
                chip.textContent = `🔊 ${ch}`;
                chip.onclick = (ev) => {
                    ev.stopPropagation();
                    playTone(620, 'triangle', 0.14);
                    speakWord(ch, 0.8);
                    burstParticles(ev.clientX, ev.clientY, item.color, ch, ch);
                };
                breakdown.appendChild(chip);
            });

            playTone(340 + (idx % 12) * 35, 'sine', 0.2);
            speakWord(item.hanzi, 0.9);
            if (x && y) burstParticles(x, y, item.color, item.icon, item.hanzi);
        }

        function replayCurrent(e) {
            playTone(540, 'triangle', 0.18);
            speakWord(currentItem.hanzi, 0.88);
            burstParticles(e.clientX, e.clientY, currentItem.color, currentItem.icon, currentItem.hanzi);
        }

        function handleSearch(val) {
            searchQuery = val;
            renderGrid();
        }

        // --- MODO QUIZ ARCADE ---
        function setMode(mode) {
            document.getElementById('btn-explore').classList.toggle('active', mode === 'explore');
            document.getElementById('btn-quiz').classList.toggle('active', mode === 'quiz');
            document.getElementById('explore-section').style.display = mode === 'explore' ? 'block' : 'none';
            document.getElementById('quiz-section').style.display = mode === 'quiz' ? 'block' : 'none';
            if (mode === 'quiz') nextQuizRound();
        }

        function nextQuizRound() {
            const pool = getFilteredVocab().length >= 4 ? getFilteredVocab() : vocabData;
            quizTarget = pool[Math.floor(Math.random() * pool.length)];

            document.getElementById('quiz-cat-badge').textContent = quizTarget.catName;
            document.getElementById('quiz-hanzi').textContent = quizTarget.hanzi;
            document.getElementById('quiz-pinyin').textContent = quizTarget.pinyin;
            speakWord(quizTarget.hanzi, 0.88);

            const opts = [quizTarget];
            while (opts.length < 4) {
                const candidate = pool[Math.floor(Math.random() * pool.length)];
                if (!opts.some(o => o.id === candidate.id)) opts.push(candidate);
            }
            opts.sort(() => Math.random() - 0.5);

            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerHTML = `<span style="font-size:1.6rem;">${opt.icon}</span> <span>${opt.es}</span>`;
                btn.onclick = (e) => verifyQuiz(opt, e);
                container.appendChild(btn);
            });
        }

        function verifyQuiz(selected, e) {
            if (selected.id === quizTarget.id) {
                quizScore += 10 + quizStreak * 2;
                quizStreak++;
                playTone(680, 'triangle', 0.25);
                burstParticles(e.clientX, e.clientY, selected.color, selected.icon, '✓');
                setTimeout(nextQuizRound, 550);
            } else {
                quizStreak = 0;
                playTone(160, 'sawtooth', 0.3);
            }
            document.getElementById('quiz-score').textContent = quizScore;
            document.getElementById('quiz-streak').textContent = quizStreak;
        }

        // Inicialización
        renderNavbar();
        renderGrid();
        selectVocabItem(vocabData[0]);
    </script>
</body>
</html>
